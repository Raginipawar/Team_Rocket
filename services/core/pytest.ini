[pytest]
# Run from /app inside the core container
testpaths = tests
asyncio_mode = auto
# Default (function-scoped) gives every test a fresh event loop, but
# db/session.py's engine/connection pool is a module-level singleton bound
# to whichever loop created it -- a second test's new loop then tries to
# tear down a connection that belongs to an already-closed loop
# ("RuntimeError: Event loop is closed"). One session-scoped loop for the
# whole run matches how the engine is actually used. Found by installing
# pytest-asyncio for the first time (it was configured here but never
# actually installed, so every async test in this suite was being silently
# skipped, not run, until now).
asyncio_default_fixture_loop_scope = session
# Ensure `from tests.conftest import ...` resolves correctly
pythonpath = /app
log_cli = true
log_cli_level = INFO
