<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoldenHour — offline</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 16px; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; background: #f5f4f2; color: #16130f; }
  .dot { width: 56px; height: 56px; border-radius: 999px; background: #d8352c; color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 800; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: #6b6760; max-width: 320px; }
  button { margin-top: 8px; border: none; border-radius: 999px; background: #16130f; color: #fff; font-weight: 700; font-size: 16px; padding: 14px 28px; }
  a.call { color: #d8352c; font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
  <div class="dot">+</div>
  <h1>Can't reach GoldenHour right now</h1>
  <p>This page couldn't load — check your connection and try again. In a real emergency, don't wait on this: call 108 directly.</p>
  <button onclick="location.reload()">Try again</button>
  <a class="call" href="tel:108">Emergency? Call 108</a>
</body>
</html>
