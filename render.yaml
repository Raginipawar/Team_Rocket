databases:
  - name: goldenhour-db
    plan: free
    databaseName: goldenhour
    user: gh

services:
  - type: redis
    name: goldenhour-redis
    plan: free
    ipAllowList: []

  - type: web
    name: goldenhour-core
    runtime: docker
    dockerfilePath: ./services/core/Dockerfile
    dockerContext: ./services/core
    plan: free
    healthCheckPath: /readyz
    preDeployCommand: python scripts/apply_sql_migrations.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goldenhour-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: goldenhour-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_KID
        value: kid1
      - key: ML_BASE_URL
        sync: false
      - key: ML_MODE
        value: real
      - key: SMS_MODE
        value: real
      - key: SMS_PROVIDER
        value: textbee
      - key: SMS_API_KEY
        sync: false
      - key: SMS_GATEWAY_DEVICE_ID
        sync: false
      - key: TELEGRAM_MODE
        value: mock
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_CHAT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
