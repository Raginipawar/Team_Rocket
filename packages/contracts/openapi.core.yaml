components:
  schemas:
    AcceptRequest:
      properties:
        room_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Room Id
        staff_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Staff Ids
      type: object
      title: AcceptRequest
    FamilyOverrideRequest:
      properties:
        hospital_id:
          type: string
          format: uuid
          title: Hospital Id
        consent:
          type: boolean
          title: Consent
      type: object
      required:
      - hospital_id
      - consent
      title: FamilyOverrideRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HandoffReceived:
      properties:
        receiving_staff_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Receiving Staff Ids
      type: object
      title: HandoffReceived
    OverrideEmergencyRequest:
      properties:
        hospital_id:
          type: string
          format: uuid
          title: Hospital Id
        reason:
          type: string
          title: Reason
      type: object
      required:
      - hospital_id
      - reason
      title: OverrideEmergencyRequest
    PatientMergeRequest:
      properties:
        phone:
          type: string
          title: Phone
      type: object
      required:
      - phone
      title: PatientMergeRequest
    RefusedTransportRequest:
      properties:
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      title: RefusedTransportRequest
    RejectRequest:
      properties:
        reason_code:
          type: string
          title: Reason Code
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - reason_code
      title: RejectRequest
    ResolveEscalationRequest:
      properties:
        option_id:
          type: string
          format: uuid
          title: Option Id
      type: object
      required:
      - option_id
      title: ResolveEscalationRequest
    ResourceUpdate:
      properties:
        available:
          type: integer
          title: Available
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
