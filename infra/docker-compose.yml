services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gh
      POSTGRES_PASSWORD: gh
      POSTGRES_DB: goldenhour
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gh -d goldenhour"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
